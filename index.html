    <!DOCTYPE html>
    <html lang="en">
    <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>THC Delivery</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
        
    </head>
    
    <body class="bg-gray-100 min-h-screen">
    
    <div class="max-w-md mx-auto p-4">
    
        <h1 class="text-3xl font-black text-green-600 py-6">
            THC DELIVERY
        </h1>
    
        <!-- REQUEST -->
        <div id="requestBox" class="bg-white p-5 rounded-2xl shadow">
    
           <h2 class="text-xl font-bold mb-4">
        ENTER YOUR NAME
    </h2>
    <p class="text-sm text-gray-500 mb-4">
        Please enter the name that matches your order slip.
    </p>
            
            <input
                id="firstName"
                class="w-full p-3 border rounded-xl mb-3"
                placeholder="First Name"
            >
    
            <input
                id="surname"
                class="w-full p-3 border rounded-xl mb-4"
                placeholder="Surname"
            >
    
            <button
                id="requestBtn"
                class="w-full bg-green-600 text-white p-3 rounded-xl font-bold"
            >
                CHECK MY ORDER
            </button>
    
        </div>
    
    
        <!-- ACTIVE DELIVERY -->
        <div id="deliveryBox" class="hidden space-y-4">
    
            <div class="bg-white p-5 rounded-2xl shadow text-center">
    
                <p class="text-xs text-gray-400 font-bold">
                    DELIVERY STATUS
                </p>
    
                <h2
                    id="status"
                    class="text-2xl font-black mt-1"
                >
                    WAITING
                </h2>
    
                <p
                    id="statusMessage"
                    class="text-sm text-gray-500 mt-2"
                >
                    Waiting for a rider...
                </p>
    
            </div>
    
    
            <!-- LOCATION -->
            <div class="bg-white p-5 rounded-2xl shadow">
    
                <h3 class="font-bold">
                    Your Location
                </h3>
    
                <p
                    id="locationMessage"
                    class="text-sm text-gray-500 my-3"
                >
                    Location has not been shared.
                </p>
    
                <button
                    id="locationBtn"
                    class="w-full bg-blue-600 text-white p-3 rounded-xl font-bold"
                >
                    SHARE MY LOCATION
                </button>
    
            </div>
    
    
            <!-- CHAT -->
            <div
                id="chatBox"
                class="hidden bg-white rounded-2xl shadow p-4"
            >
    
                <h3 class="font-bold mb-3">
                    Message Rider
                </h3>
    
                <div
                    id="messages"
                    class="space-y-2 max-h-52 overflow-y-auto mb-3"
                ></div>
    
                <div class="flex gap-2">
    
                    <input
                        id="messageInput"
                        class="flex-1 p-3 border rounded-xl"
                        placeholder="Type message"
                    >
    
                    <button
                        id="sendBtn"
                        class="bg-green-600 text-white px-4 rounded-xl font-bold"
                    >
                        SEND
                    </button>
    
                </div>
    
            </div>
    
        </div>
    
    </div>
    
    
    <script>
    
    const firebaseConfig = {
      apiKey: "AIzaSyC57agn1E9fiWBY1Zls4HggsKwKsQAwBoQ",
      authDomain: "thc-rider-tracker.firebaseapp.com",
      databaseURL: "https://thc-rider-tracker-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "thc-rider-tracker",
      storageBucket: "thc-rider-tracker.firebasestorage.app",
      messagingSenderId: "1020694020459",
      appId: "1:1020694020459:web:3abf81418fec72af168c2e"
    };
    
    firebase.initializeApp(firebaseConfig);
    
    const auth = firebase.auth();
    const db = firebase.database();
        
    let deliveryKey =
        localStorage.getItem("thcDeliveryKey");
        
        let deliveredHandled = false;
    
    
    // CHECK MY ORDER

document
.getElementById("requestBtn")
.addEventListener("click", async function () {

    const first =
        document.getElementById("firstName").value.trim();

    const last =
        document.getElementById("surname").value.trim();

    if (!first || !last) {

        alert("Please enter your first name and surname.");

        return;
    }

    try {

        // CHECK FOR EXISTING ACTIVE DELIVERY
        if (deliveryKey) {

            const existingSnapshot =
                await db.ref(
                    "deliveries/" +
                    deliveryKey
                ).once("value");

            const existingData =
                existingSnapshot.val();

            if (
                existingData &&
                existingData.status !== "DELIVERED"
            ) {

                openDelivery();

                return;
            }

            // OLD DELIVERY DOES NOT EXIST
            // OR IS ALREADY DELIVERED
            localStorage.removeItem(
                "thcDeliveryKey"
            );

            deliveryKey = null;
        }

        // SIGN IN CUSTOMER
        const login =
            await auth.signInAnonymously();

        const customerUid =
            login.user.uid;

        // CREATE NEW DELIVERY
        const delivery =
            db.ref("deliveries").push();

        await delivery.set({

            customerUid:
                customerUid,

            customerName:
                first + " " + last,

            status:
                "WAITING",

            createdAt:
                firebase.database.ServerValue.TIMESTAMP

        });

        deliveryKey =
            delivery.key;

        localStorage.setItem(
            "thcDeliveryKey",
            deliveryKey
        );

        openDelivery();

    } catch (error) {

        alert(
            "Unable to check order: " +
            error.message
        );

    }

});
    
    
    // OPEN DELIVERY
    
    function openDelivery() {
    
        document
        .getElementById("requestBox")
        .classList.add("hidden");
    
    
        document
        .getElementById("deliveryBox")
        .classList.remove("hidden");
    
    
          watchDelivery();
        listenForMessages();
    
    }
    
    
    // WATCH DELIVERY
    
    function watchDelivery() {
    
        if (!deliveryKey) return;
    
    
        db.ref(
            "deliveries/" + deliveryKey
        )
        .on("value", snapshot => {
    
            const data =
                snapshot.val();
    
    
            if (!data) return;
    
    
            document
            .getElementById("status")
            .textContent =
                data.status;
    
    
            const message =
                document.getElementById(
                    "statusMessage"
                );
    
    
            if (data.status === "WAITING") {
    
                message.textContent =
                    "Waiting for a rider...";
    
            }
    
    
            if (data.status === "ACCEPTED") {
    
                message.textContent =
                    "A rider accepted your request.";
    
                document
                .getElementById("chatBox")
                .classList.remove("hidden");
    
            }
    
    
            if (data.status === "ON_THE_WAY") {
    
                message.textContent =
                    "Your rider is on the way.";
    
                document
                .getElementById("chatBox")
                .classList.remove("hidden");
    
            }
    
    
           if (data.status === "DELIVERED") {
    
        if (!deliveredHandled) {
    
            deliveredHandled = true;
    
            message.textContent =
                "Your delivery is complete.";
    
            document
            .getElementById("chatBox")
            .classList.add("hidden");
    
            document
            .getElementById("locationBtn")
            .classList.add("hidden");
    
            setTimeout(() => {
    
                localStorage.removeItem(
                    "thcDeliveryKey"
                );
    
                deliveryKey = null;
    
                window.location.reload();
    
            }, 3000);
    
        }
    
    }
    
    // SHARE LOCATION
    
    document
    .getElementById("locationBtn")
    .addEventListener("click", () => {
    
        if (!navigator.geolocation) {
    
            alert(
                "GPS is not supported on this device."
            );
    
            return;
        }
    
    
        navigator.geolocation.getCurrentPosition(
    
            async position => {
    
                const latitude =
                    position.coords.latitude;
    
                const longitude =
                    position.coords.longitude;
    
    
                await db.ref(
                    "deliveries/" +
                    deliveryKey
                )
                .update({
    
                    latitude:
                        latitude,
    
                    longitude:
                        longitude
    
                });
    
    
                alert(
                    "Location shared with rider."
                );
    
            },
    
            () => {
    
                alert(
                    "Please allow location access."
                );
    
            }
    
        );
    
    });
    
    
    // SEND MESSAGE
    
    function sendMessage() {
    
        const input =
            document.getElementById(
                "messageInput"
            );
    
    
        const text =
            input.value.trim();
    
    
        if (!text) return;
    
    
        db.ref(
            "deliveries/" +
            deliveryKey +
            "/chat"
        )
        .push({
    
            sender:
                "customer",
    
            text:
                text,
    
            timestamp:
                firebase.database.ServerValue.TIMESTAMP
    
        });
    
    
        input.value = "";
    
    }
    
    
    document
    .getElementById("sendBtn")
    .addEventListener(
        "click",
        sendMessage
    );
    
    
    document
    .getElementById("messageInput")
    .addEventListener(
        "keypress",
        event => {
    
            if (event.key === "Enter") {
    
                sendMessage();
    
            }
    
        }
    );
    
    
    // RECEIVE CHAT MESSAGES
    
    function listenForMessages() {
    
        if (!deliveryKey) return;
    
        const chatRef = db.ref(
            "deliveries/" +
            deliveryKey +
            "/chat"
        );
    
        chatRef.off("value");
    
        chatRef.on("value", snapshot => {
    
            const messages =
                snapshot.val() || {};
    
            const container =
                document.getElementById(
                    "messages"
                );
    
            container.innerHTML = "";
    
            Object
            .values(messages)
            .forEach(message => {
    
                const messageDiv =
                    document.createElement("div");
    
                messageDiv.className =
                    message.sender === "customer"
                    ? "bg-green-100 p-2 rounded-xl text-sm"
                    : "bg-blue-100 p-2 rounded-xl text-sm";
    
                messageDiv.textContent =
                    (message.sender === "customer"
                        ? "You: "
                        : "Rider: ") +
                    message.text;
    
                container.appendChild(
                    messageDiv
                );
    
            });
    
            container.scrollTop =
                container.scrollHeight;
    
        });
    
    }
    
    
    // RESUME ACTIVE DELIVERY
    
    async function resumeDelivery() {
    
        if (!deliveryKey) {
            return;
        }
    
        const snapshot =
            await db.ref(
                "deliveries/" +
                deliveryKey
            ).once("value");
    
        const data =
            snapshot.val();
    
        if (!data) {
    
            localStorage.removeItem(
                "thcDeliveryKey"
            );
    
            deliveryKey = null;
    
            return;
        }
    
        if (data.status === "DELIVERED") {
    
            localStorage.removeItem(
                "thcDeliveryKey"
            );
    
            deliveryKey = null;
    
            return;
        }
    
        openDelivery();
    }
    
    resumeDelivery();
    
    </script>
    
    </body>
    </html>
